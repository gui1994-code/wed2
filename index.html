<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tatiana & Paulo · 17 Abril 2027</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Georgia', serif;
            color: #ffffff;
        }

        /* Ecrã Inicial com Fundo Preto */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background-color: #000000;
            padding: 20px;
            text-align: center;
        }

        /* Texto Inicial */
        .intro-title {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 40px;
            color: #f0f0f0;
        }

        /* Contentor do Envelope com efeito ao passar o rato/toque */
        .envelope-container {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .envelope-container:hover {
            transform: scale(1.04);
            filter: brightness(1.1);
        }

        /* Ícone do Envelope (SVG Elegante) */
        .envelope-icon {
            width: 110px;
            height: 110px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 20px;
        }

        /* Texto/Botão por baixo do Envelope */
        .open-label {
            font-family: Arial, sans-serif;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #cccccc;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            padding-bottom: 4px;
        }

        /* Contentor do Vídeo */
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: none; /* Oculto até clicar no envelope */
            background-color: #c5beb3;
            justify-content: center;
            align-items: center;
        }

        /* Vídeo ajustado ao ecrã */
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Ecrã Inicial: Texto + Envelope -->
    <div id="start-screen">
        <h1 class="intro-title">Tatiana & Paulo apresentam</h1>
        
        <div class="envelope-container" onclick="startExperience()">
            <!-- Desenho vectorial de um envelope elegante -->
            <svg class="envelope-icon" viewBox="0 0 24 24">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <span class="open-label">Abrir Convite</span>
        </div>
    </div>

    <!-- Contentor do Vídeo com controlos ativos -->
    <div class="video-container" id="videoContainer">
        <video id="bgVideo" playsinline loop controls preload="auto">
            <source src="https://github.com/gui1994-code/wed/releases/download/1.0/1031.mp4" type="video/mp4">
            O seu navegador não suporta vídeos.
        </video>
    </div>

    <script>
        function startExperience() {
            // Esconde o ecrã do envelope
            const startScreen = document.getElementById('start-screen');
            startScreen.style.display = 'none';
            
            // Mostra o contentor do vídeo com o fundo ajustado
            const container = document.getElementById('videoContainer');
            container.style.display = 'flex';
            
            // Ativa o som e inicia o vídeo
            const video = document.getElementById('bgVideo');
            video.muted = false;
            video.play().catch(error => {
                console.log("Erro ao reproduzir o vídeo:", error);
            });
        }
    </script>

</body>
</html>
