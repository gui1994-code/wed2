    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background-color: #c5beb3;
            font-family: 'Playfair Display', Georgia, serif;
            color: #333333;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Ecrã Inicial com Fundo Preto */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background-color: #000000;
            padding: 20px;
            text-align: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #start-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Título Inicial em Caligrafia */
        .intro-title {
            font-family: 'Great Vibes', cursive;
            font-size: 52px;
            font-weight: 400;
            margin-bottom: 30px;
            color: #ffffff;
            letter-spacing: 1px;
        }

        /* Contentor do Envelope */
        .envelope-container {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .envelope-container:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        .envelope-icon {
            width: 100px;
            height: 100px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 20px;
        }

        .open-label {
            font-family: 'Playfair Display', serif;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #cccccc;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            padding-bottom: 4px;
            transition: color 0.3s ease;
        }

        /* Contentor Principal da Experiência */
        #main-content {
            display: none;
            opacity: 0;
            flex-direction: column;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            transition: opacity 1s ease;
            background-color: #c5beb3;
        }

        #main-content.fade-in {
            display: flex;
            opacity: 1;
        }

        /* Contentor do Vídeo */
        .video-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #c5beb3;
            flex-shrink: 0;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* REMOVER O GRADIENTE/BARRA NEGRA AO FAZER HOVER */
        video::-webkit-media-controls-panel {
            background-image: none !important;
            background: transparent !important;
        }
        video::-webkit-media-controls-enclosure {
            background: none !important;
        }

            text-align: center;
            background-color: #c5beb3;

            font-family: 'Great Vibes', cursive;
            font-size: 48px;
            font-weight: 400;
            margin-bottom: 15px;
            color: #2b2b2b;
        }
