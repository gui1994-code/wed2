<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tatiana & Paulo · 17 Abril 2027</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background-color: #d9cebe;
            font-family: 'Playfair Display', Georgia, serif;
            color: #2b2b2b;
            overflow-x: hidden;
            overflow-y: auto;
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background-color: #d9cebe;
            padding: 20px;
            text-align: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #start-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .intro-title {
            font-family: 'Great Vibes', cursive;
            font-size: 52px;
            font-weight: 400;
            margin-bottom: 30px;
            color: #2b2b2b;
            letter-spacing: 1px;
        }

        .envelope-container {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .envelope-container:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        .envelope-icon {
            width: 100px;
            height: 100px;
            fill: none;
            stroke: #2b2b2b;
            stroke-width: 1.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 20px;
        }

        .open-label {
            font-family: 'Playfair Display', serif;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #4a4a4a;
            border-bottom: 1px solid rgba(43, 43, 43, 0.4);
            padding-bottom: 4px;
        }

        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            background-color: #d9cebe;
        }

        #main-content.visible {
            display: flex;
        }

        .video-container {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #d9cebe;
            padding: 20px 0;
            flex-shrink: 0;
        }

        .video-container video {
            width: 100%;
            max-width: 800px;
            height: auto;
            max-height: 85vh;
            display: block;
            object-fit: contain;
        }

        .details-section {
            width: 100%;
            max-width: 600px;
            padding: 40px 20px 80px 20px;
            text-align: center;
            background-color: #d9cebe;
        }

        .details-title {
            font-family: 'Great Vibes', cursive;
            font-size: 48px;
            font-weight: 400;
            margin-bottom: 15px;
            color: #2b2b2b;
        }

        .details-text {
            font-family: 'Playfair Display', serif;
            font-size: 17px;
            line-height: 1.8;
            color: #4a4a4a;
            margin-bottom: 30px;
        }

        .details-text strong {
            font-size: 20px;
            color: #1a1a1a;
            font-weight: 600;
        }

        .maps-btn {
            display: inline-block;
            background-color: #2b2b2b;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            font-family: 'Playfair Display', serif;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }

        .maps-btn:hover {
            background-color: #000000;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 class="intro-title">Tatiana & Paulo apresentam</h1>
        
        <div class="envelope-container" onclick="startExperience()">
            <svg class="envelope-icon" viewBox="0 0 24 24">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <span class="open-label" id="openLabel">Abrir Convite</span>
        </div>
    </div>

    <div id="main-content">
        <div class="video-container">
            <video id="bgVideo" playsinline loop controls preload="auto">
                <source src="https://github.com/gui1994-code/wed/releases/download/1.0/1031.mp4" type="video/mp4">
                O seu navegador não suporta vídeos.
            </video>
        </div>

        <div class="details-section">
            <h2 class="details-title">Localização</h2>
            <p class="details-text">
                <strong>Quinta Entre Vinhas</strong><br>
                Rua das Flores, nº574<br>
                S. Faustino, Guimarães
            </p>
            <a href="https://maps.google.com/?q=Quinta+Entre+Vinhas+Rua+das+Flores+574+S.+Faustino+Guimaraes" target="_blank" rel="noopener noreferrer" class="maps-btn">
                Abrir no Google Maps
            </a>
        </div>
    </div>

    <script>
        function startExperience() {
            const label = document.getElementById('openLabel');
            label.textContent = "A carregar...";

            const startScreen = document.getElementById('start-screen');
            const mainContent = document.getElementById('main-content');
            const video = document.getElementById('bgVideo');

            mainContent.classList.add('visible');

            function reveal() {
                startScreen.classList.add('fade-out');
            }

            video.muted = false;
            const playPromise = video.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    reveal();
                }).catch(() => {
                    video.muted = true;
                    video.play().then(reveal).catch(reveal);
                });
            } else {
                reveal();
            }
        }
    </script>

</body>
</html>
